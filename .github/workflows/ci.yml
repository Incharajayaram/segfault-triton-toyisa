# Unified CI. Every job here is a `make` target, so a red CI run is reproducible
# locally with one command. If a check exists only in this file, it does not
# exist. See docs/team/testing-ci.md.
#
# Design constraints, all of them deliberate:
#   * no GPU, no CUDA, no Triton, no torch in the gating jobs
#   * fixtures are checked in, so all expectations are available offline
#   * bench publishes an artifact and never gates a merge

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flip to "1" at the end of day 3. That single edit converts every `real`
  # row in the suite from xfail to hard failure (docs/team/testing-ci.md R4).
  STRICT_REAL: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install ruff
      - run: make lint PY=python

  canon:
    name: fixture canon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      # stdlib only: the canon check must be able to run on a bare runner
      - run: make golden-check PY=python

  test-map:
    name: module and contract mapping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python tools/check_test_map.py

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: strict real-input gate
        if: env.STRICT_REAL == '1'
        run: python -m pytest -q --strict-real
      - name: upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python }}
          path: junit.xml
          if-no-files-found: ignore

  test-map-strict:
    name: mapping (strict)
    if: env.STRICT_REAL == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python tools/check_test_map.py --strict

  bench:
    name: bench (publishes, never gates)
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: make bench PY=python
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results.json
          if-no-files-found: warn
      - name: print results table
        run: python bench/report_table.py bench/results.json >> "$GITHUB_STEP_SUMMARY"

  # Manual only. Needs Triton and rewrites reviewed artifacts, so it never
  # runs on a push, and it never opens a PR: it attaches the new fixtures and
  # a diff of GOLDEN.json for a human to accept.
  fixtures-refresh:
    name: regenerate fixtures (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[extract]'
      - run: make fixtures PY=python
      - run: git diff --exit-code fixtures/GOLDEN.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: fixtures-refreshed
          path: |
            fixtures/*.ttir
            fixtures/GOLDEN.json
