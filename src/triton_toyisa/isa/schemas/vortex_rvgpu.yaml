schema_version: 1
name: vortex_rvgpu
description: >
  Vortex open-source RISC-V SIMT GPGPU architecture with memory coalescer,
  multi-banked scratchpad memory (16 banks), Tensor Core Unit (TCU_MMA16, TCU_MMA32),
  and SIMT vector processing unit (VPU).

data_model:
  memory_spaces:
    - name: global
      kind: flat
      dtype: f32
      alignment_words: 8
    - name: scratch
      kind: banked
      dtype: f32
      banks: 16
      interleave_bytes: 4
      alignment_words: 1
    - name: accum
      kind: register
      dtype: f32
      alignment_words: 1
  tile_dims: [BM, BN, BK]
  max_dims: 4

# `op:` names the operations each elementwise unit performs. Without it every
# instruction here shares one rule and one cost (`0.05 * words`), so minimum-cost
# selection resolved the tie by declaration order and chose VADD for *every*
# elementwise operation -- including relu, which the emulator then computed as an
# addition and returned a wrong answer for with no diagnostic. Declaring the ops
# lets selection reject an instruction that cannot perform the operation.
instructions:
  - name: LDG
    kind: memory
    direction: load
    rule: memory
    addressing: {form: coalesced_global, fields: [base, sizes, strides, offsets]}
    time: {expr: "words / 2.0", unit: word}
    cost: {expr: "0.50 * words", unit: word}
    constraint: "in_bounds(base, length)"
    semantics: "dst[0:length] = global[base:base+length]"

  - name: STG
    kind: memory
    direction: store
    rule: memory
    addressing: {form: coalesced_global, fields: [base, sizes, strides, offsets]}
    time: {expr: "words / 2.0", unit: word}
    cost: {expr: "0.50 * words", unit: word}
    constraint: "in_bounds(base, length)"
    semantics: "global[base:base+length] = src[0:length]"

  # LDS/STS move data *within* the scratchpad: their semantics read `scratch[...]`
  # and never touch global memory, so they are not a valid single-instruction
  # lowering of a `tt.load` or `tt.store` against a global pointer -- the data
  # would have to be staged into scratch first. Declared `rule: memory` (as they
  # were) they joined the candidate set for every global load and store, and at
  # 0.10/word against LDG/STG's 0.50/word they won every selection on minimum
  # cost. The emitted program then read a scratchpad buffer nothing had filled,
  # which surfaced as the emulator being handed a size-1 buffer. `rule: scratch`
  # keeps them declared, validated and costed while making them inadmissible for
  # an operand no recognition rule maps to that rule -- the same treatment
  # BARRIER gets. Contrast toyisa2's LDG/LDS2D, which are genuine global->scratch
  # moves and so are correctly `rule: memory`.
  - name: LDS
    kind: memory
    direction: load
    rule: scratch
    addressing: {form: banked_scratchpad, fields: [base, sizes, strides, offsets]}
    time: {expr: "words / 8.0", unit: word}
    cost: {expr: "0.10 * words", unit: word}
    constraint: "aligned(base, 4)"
    semantics: "dst[0:length] = scratch[base:base+length]"

  - name: STS
    kind: memory
    direction: store
    rule: scratch
    addressing: {form: banked_scratchpad, fields: [base, sizes, strides, offsets]}
    time: {expr: "words / 8.0", unit: word}
    cost: {expr: "0.10 * words", unit: word}
    constraint: "aligned(base, 4)"
    semantics: "scratch[base:base+length] = src[0:length]"

  - name: TCU_MMA16
    kind: compute
    rule: mac
    tile: {m: 16, n: 16}
    addressing: {form: register}
    computation_attrs: [tile_shape, dtype, accumulate]
    accumulate: {precision: tf32, reduce_dim: k, order: k_major_sequential}
    time: {expr: "1.0 * m * n * k / (16*16)", unit: cycle}
    cost: {expr: "0.40 * m * n * k / (16*16)", unit: mac}
    constraint: "all_of(m % 16 == 0, n % 16 == 0)"
    semantics: "acc[m,n] += sum_k tf32(a[m,k]) * tf32(b[k,n])"

  - name: TCU_MMA32
    kind: compute
    rule: mac
    tile: {m: 32, n: 32}
    addressing: {form: register}
    computation_attrs: [tile_shape, dtype, accumulate]
    accumulate: {precision: tf32, reduce_dim: k, order: k_major_sequential}
    time: {expr: "1.0 * m * n * k / (32*32)", unit: cycle}
    cost: {expr: "0.25 * m * n * k / (32*32)", unit: mac}
    constraint: "all_of(m % 32 == 0, n % 32 == 0)"
    semantics: "acc[m,n] += sum_k tf32(a[m,k]) * tf32(b[k,n])"

  - name: VADD
    kind: compute
    rule: elementwise
    op: [arith.addf, arith.addi]
    addressing: {form: register}
    time: {expr: "words / 16.0", unit: cycle}
    cost: {expr: "0.05 * words", unit: alu}
    constraint: "aligned(base, 4)"
    semantics: "dst[i] = src0[i] + src1[i]"

  - name: VMUL
    kind: compute
    rule: elementwise
    op: [arith.mulf, arith.muli]
    addressing: {form: register}
    time: {expr: "words / 16.0", unit: cycle}
    cost: {expr: "0.05 * words", unit: alu}
    constraint: "aligned(base, 4)"
    semantics: "dst[i] = src0[i] * src1[i]"

  - name: VSUB
    kind: compute
    rule: elementwise
    op: [arith.subf]
    addressing: {form: register}
    time: {expr: "words / 16.0", unit: cycle}
    cost: {expr: "0.05 * words", unit: alu}
    constraint: "aligned(base, 4)"
    semantics: "dst[i] = src0[i] - src1[i]"

  - name: VMOD
    kind: compute
    rule: elementwise
    op: [arith.remsi, arith.remui]
    addressing: {form: register}
    time: {expr: "words / 8.0", unit: cycle}
    cost: {expr: "0.10 * words", unit: alu}
    constraint: "aligned(base, 4)"
    semantics: "dst[i] = src0[i] % src1[i]"

  - name: VRELU
    kind: compute
    rule: elementwise
    op: [arith.maxnumf]
    addressing: {form: register}
    time: {expr: "words / 16.0", unit: cycle}
    cost: {expr: "0.05 * words", unit: alu}
    constraint: "aligned(base, 4)"
    semantics: "dst[i] = max(0, src[i])"

  - name: VCLAMP
    kind: compute
    rule: elementwise
    op: [arith.maxnumf, arith.minnumf]
    addressing: {form: register}
    time: {expr: "words / 16.0", unit: cycle}
    cost: {expr: "0.05 * words", unit: alu}
    constraint: "aligned(base, 4)"
    semantics: "dst[i] = min(max(lo, src[i]), hi)"

  # BARRIER is a synchronisation instruction, not a memory-movement one. It was
  # previously declared `kind: memory, rule: memory`, which put it in the
  # candidate set the selector enumerates for every `tt.load` and `tt.store`.
  # With a trivially-true constraint (`aligned(base, 1)`) and a flat cost of
  # 0.01 it then won *every* memory selection on min-cost, so each load and
  # store in each kernel lowered to a barrier and the emitted program moved no
  # data at all. `kind: control` keeps it declarable and costed without making
  # it admissible for a memory operand: no ttir operation maps to the `barrier`
  # rule, so it is never selected, which is the correct behaviour for a fence.
  - name: BARRIER
    kind: control
    rule: barrier
    addressing: {form: register}
    time: {expr: "1.0", unit: cycle}
    cost: {expr: "0.01", unit: ctrl}
    constraint: "aligned(base, 1)"
    semantics: "vx_bar(warp_group)"
